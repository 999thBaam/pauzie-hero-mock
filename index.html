<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pauzie — Hero Mock</title>
<meta name="description" content="Pauzie Device hero mock: train your focus, own your time.">
<meta name="theme-color" content="#0b1020">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="bar" id="bar"><a class="logo" href="#" aria-label="Pauzie"><img class="lt" src="assets/logo/pauzie-logo-light.svg" alt=""><img class="dk" src="assets/logo/pauzie-logo-dark.svg" alt=""></a><a class="pre" href="#rest">Pre-order ₹1,999</a></header>

<section class="hero" id="hero">
  <div class="stage" id="stage">
    <div class="strips" id="strips"></div>
    <div class="halo" id="halo"></div>
    <canvas id="device" aria-label="Pauzie Device"></canvas>
    <div class="ripple" id="ripple" aria-hidden="true"><i></i><i></i><i></i></div>

    <div class="cap cap1" id="cap1">
      <p class="big">Gym for your body.<br><em><img class="inlogo" src="assets/logo/pauzie-logo-light.svg" alt="Pauzie"> for your mind.</em></p>
    </div>
    <div class="cap cap2" id="cap2"><p class="big">Tap once.</p></div>
    <div class="cap cap3" id="cap3">
      <h1>Take back<br>your time.</h1>
    </div>
  </div>
</section>

<section class="rest" id="rest">
  <h2>Pre-order ₹1,999</h2>
</section>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module" src="app.js"></script>
</body>
</html>
