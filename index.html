<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pauzie — Hero Mock</title>
<meta name="description" content="Pauzie Device hero mock: less scrolling, more living.">
<meta name="theme-color" content="#0b1020">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="style.css?v=4">
<link rel="stylesheet" href="story.css?v=1">
</head>
<body>

<header class="bar" id="bar"><a class="logo" href="#" aria-label="Pauzie"><img class="lt" src="assets/logo/pauzie-logo-light.svg" alt=""><img class="dk" src="assets/logo/pauzie-logo-dark.svg" alt=""></a><a class="pre" href="#">Pre-order ₹1,999</a></header>

<section class="hero" id="hero">
  <div class="stage" id="stage">
    <div class="strips" id="strips"></div>
    <div class="halo" id="halo"></div>
    <canvas id="device" aria-label="Pauzie Device"></canvas>
    <div class="ripple" id="ripple" aria-hidden="true"><i></i><i></i><i></i></div>

    <div class="cap cap1" id="cap1">
      <p class="big">Less scrolling.<br><em>More living.</em></p>
    </div>
    <div class="cap cap2" id="cap2"><p class="big tapmsg">A tap away<br>from distractions.</p></div>
    <div class="cap cap3" id="cap3">
      <h1>Make time<br>for what matters.</h1>
    </div>
    <div class="endcap" id="cap4">
      <p class="sub">Tap your phone on <img class="inlogo" src="assets/logo/pauzie-logo-dark.svg" alt="Pauzie"> to block distracting apps.</p>
      <a class="cta" href="#">Pre-order ₹1,999</a>
    </div>
  </div>
</section>

<section class="story" id="how" aria-labelledby="storyH">
  <p class="story-kicker">How it works</p>
  <h2 id="storyH">Meet Riya.<br>Watch her win her day back.</h2>
  <div class="sv" id="sv" tabindex="0" aria-roledescription="story" aria-label="How Pauzie works, a story in 7 cards">
    <div class="sv-bars" id="svBars"></div>
    <div class="sv-track" id="svTrack"></div>
    <button class="sv-nav sv-prev" id="svPrev" aria-label="Previous">‹</button>
    <button class="sv-nav sv-next" id="svNext" aria-label="Next">›</button>
  </div>
  <p class="story-hint" id="svHint">Tap or swipe →</p>
</section>
